[main]
font=UbuntuMono Nerd Font Mono:size=14
pad=15x15
# foot's default entry lacks the terminfo RGB capability, which ncurses
# apps (e.g. neomutt) need before they allow #rrggbb colors.
term=foot-direct

[scrollback]
# Allocated lazily; worst case when completely full is ~5KB/line at wide
# terminal sizes, so ~1GB — same ceiling as ghostty's scrollback-limit.
lines=200000
