general {
    ignore_dbus_inhibit = false
}

# Locking is owned by DMS (settings.json: acLockTimeout=600, lockBeforeSuspend,
# loginctl integration). hypridle only turns the display off; running hyprlock
# here too made two lockers race for the one Wayland session lock.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
