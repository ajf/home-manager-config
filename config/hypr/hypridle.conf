general {
    ignore_dbus_inhibit = false
}

# All idle policy now lives in DMS (settings.json): lock, display blanking and
# suspend, each with separate AC and battery timeouts. hypridle has no
# listeners left.
#
# It used to own display blanking, with locking left to DMS because running
# hyprlock here too made two lockers race for the one Wayland session lock.
# That split stopped making sense once the lock timeout came down: hypridle
# has no idea whether the machine is on AC or battery, so blanking could not
# track the lock, and the panel sat lit on the lock screen for minutes.
#
# DMS drives its timeouts off upower, so blanking follows the lock and gets
# to be more aggressive on battery than on AC.
#
# Note this file is shared by every DMS-desktop host, so a machine whose
# DankMaterialShell settings.json still has *MonitorTimeout = 0 will not blank
# at all until those are set -- settings.json is machine-local and does not
# travel with this repo.
