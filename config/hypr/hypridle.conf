general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600
    on-timeout = hyprlock
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    # USR2 asks hyprlock to redraw after the display wakes; USR1 would
    # unlock it entirely (that bug made the lock vanish on mouse-wiggle).
    on-resume = hyprctl dispatch dpms on && pkill -USR2 hyprlock
}
